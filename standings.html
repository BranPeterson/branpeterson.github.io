<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>World Cup Hub — Standings</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Archivo:wght@600;700;800&family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet" />
<link rel="stylesheet" href="assets/style.css" />
</head>
<body>
<main class="wrap">
  <div class="eyebrow">Group tables</div>
  <h1 class="page">Standings</h1>
  <p class="lede">Twelve groups of four. Top two from each group plus the eight best third-placed teams advance to the Round of 32.</p>
  <div class="callout" style="margin-top:16px"><b>Green bar</b> marks the automatic top-two qualifying places. Tables sort on points, then goal difference, then goals scored.</div>

  <div class="grid cols-2" id="groups" style="margin-top:26px"></div>
</main>

<script src="assets/data.js"></script>
<script src="assets/app.js"></script>
<script src="assets/live.js"></script>
<script>
  mountNav("standings.html");
  mountFoot();

  function renderPage() {
    const wrap = document.getElementById("groups");
    wrap.innerHTML = "";
    Object.entries(WC.groups).forEach(([k, rows]) => wrap.append(groupCard(k, rows)));
  }

  async function start() {
    if (typeof goLive === "function") await goLive();
    renderPage();
  }
  start();
</script>
</body>
</html>
