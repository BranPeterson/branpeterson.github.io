<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>World Cup Hub — Schedule</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Archivo:wght@600;700;800&family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet" />
<link rel="stylesheet" href="assets/style.css" />
</head>
<body>
<main class="wrap">
  <div class="eyebrow">Fixtures & results</div>
  <h1 class="page">Schedule</h1>
  <p class="lede">All matches across the group stage, sorted by date. Filter by group or status. Finished games link straight to highlights.</p>

  <div class="section-head"><h2>Status</h2></div>
  <div class="chips" id="statusChips">
    <button class="chip on" data-st="all">All</button>
    <button class="chip" data-st="LIVE">Live</button>
    <button class="chip" data-st="UP">Upcoming</button>
    <button class="chip" data-st="FT">Finished</button>
  </div>

  <div class="section-head" style="margin-top:18px"><h2>Group</h2></div>
  <div class="chips" id="groupChips">
    <button class="chip on" data-g="all">All</button>
  </div>

  <div class="grid cols-3" id="list" style="margin-top:26px"></div>
  <p id="empty" style="display:none;color:var(--mute);text-align:center;padding:40px 0">No matches match those filters.</p>
</main>

<script src="assets/data.js"></script>
<script src="assets/app.js"></script>
<script src="assets/live.js"></script>
<script>
  mountNav("schedule.html");
  mountFoot();

  let fStatus = "all", fGroup = "all";

  function buildGroupChips() {
    const gChips = document.getElementById("groupChips");
    gChips.innerHTML = '<button class="chip on" data-g="all">All</button>';
    Object.keys(WC.groups).sort().forEach(g => {
      gChips.append(el(`<button class="chip" data-g="${g}">${g}</button>`));
    });
  }

  function render() {
    const list = document.getElementById("list");
    list.innerHTML = "";
    const rows = WC.matches.filter(m =>
      (fStatus === "all" || m.status === fStatus) &&
      (fGroup === "all" || m.group === fGroup));
    rows.forEach(m => list.append(matchCard(m)));
    document.getElementById("empty").style.display = rows.length ? "none" : "block";
  }

  function renderPage() {
    buildGroupChips();
    render();
  }

  document.getElementById("statusChips").addEventListener("click", e => {
    if (!e.target.dataset.st) return;
    fStatus = e.target.dataset.st;
    document.querySelectorAll("#statusChips .chip").forEach(c => c.classList.toggle("on", c === e.target));
    render();
  });
  document.getElementById("groupChips").addEventListener("click", e => {
    if (!e.target.dataset.g) return;
    fGroup = e.target.dataset.g;
    document.querySelectorAll("#groupChips .chip").forEach(c => c.classList.toggle("on", c === e.target));
    render();
  });

  async function start() {
    if (typeof goLive === "function") await goLive();
    renderPage();
  }
  start();
</script>
</body>
</html>
